<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Galaxia de Tulipanes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05020a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            display: flex;
            gap: 12px;
        }
        .icon-btn {
            background: rgba(20, 20, 30, 0.6);
            border: 1px solid rgba(255, 105, 180, 0.4);
            color: #ff69b4;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        /* Texto flotante al tocar */
        .tap-text {
            position: absolute;
            color: #ff69b4;
            font-size: 22px;
            font-weight: 800;
            text-shadow: 0 0 10px #ff1493, 0 0 20px #ff69b4;
            pointer-events: none;
            z-index: 100;
            animation: floatUp 1.2s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.8);
            }
            50% {
                transform: translate(-50%, -80px) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -120px) scale(1);
            }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="controls">
        <div class="icon-btn" id="music-btn" onclick="toggleAudio()">🎵</div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let galaxyParticles, heartMesh;
        const textSprites = [];

        const messages = [
            "TE AMO 💖",
            "Mi princesa 👑",
            "Mi reina hermosa 👸🏻",
            "Mis ojitos lindos 👀💕",
            "Eres mi lugar favorito 🏡✨",
            "Siempre juntos 🤍",
            "Mi amor 💖",
            "Mi vida ✨",
            "Me haces muy feliz 🥰",
            "La más linda 🌸",
            "Mi todo 🌎"
        ];

        function createTextTexture(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;

            ctx.fillStyle = "rgba(25, 10, 30, 0.85)";
            ctx.strokeStyle = "#ff69b4";
            ctx.lineWidth = 6;
            
            // Dibujar fondo redondeado
            ctx.beginPath();
            ctx.roundRect(10, 10, 492, 108, 30);
            ctx.fill();
            ctx.stroke();

            // Dibujar texto
            ctx.font = "Bold 36px sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "#ff69b4";
            ctx.shadowBlur = 15;
            ctx.fillText(text, 256, 64);

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x05020a, 0.04);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 9);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.8;
            controls.maxDistance = 18;
            controls.minDistance = 3;

            createGalaxy();
            createHeartCore();
            createTulips();
            create3DTexts();

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xff69b4, 2.8, 22);
            pointLight.position.set(0, 0, 0);
            scene.add(pointLight);

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', spawnTapText);

            animate();
        }

        function create3DTexts() {
            messages.forEach((msg, index) => {
                const texture = createTextTexture(msg);
                const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
                const sprite = new THREE.Sprite(spriteMaterial);

                const angle = (index / messages.length) * Math.PI * 2;
                const radius = 2.8 + (index % 3) * 0.8;
                const y = ((index % 4) - 1.5) * 1.2;

                sprite.position.set(
                    Math.cos(angle) * radius,
                    y,
                    Math.sin(angle) * radius
                );

                sprite.scale.set(2.2, 0.55, 1);
                scene.add(sprite);
                textSprites.push(sprite);
            });
        }

        function createGalaxy() {
            const particleCount = 12000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const colorPink = new THREE.Color(0xff69b4);
            const colorMagenta = new THREE.Color(0xff1493);
            const colorLightPink = new THREE.Color(0xffb6c1);

            for (let i = 0; i < particleCount; i++) {
                const r = Math.pow(Math.random(), 2) * 7 + 0.5;
                const theta = Math.random() * Math.PI * 2 * 3;
                const phi = (Math.random() - 0.5) * 0.5;

                const x = r * Math.cos(theta);
                const y = phi * (7 - r) * 0.5;
                const z = r * Math.sin(theta);

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                let mixedColor = colorPink.clone();
                if (Math.random() > 0.5) mixedColor.lerp(colorMagenta, Math.random());
                if (Math.random() > 0.7) mixedColor.lerp(colorLightPink, Math.random());

                colors[i * 3] = mixedColor.r;
                colors[i * 3 + 1] = mixedColor.g;
                colors[i * 3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.035,
                vertexColors: true,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending
            });

            galaxyParticles = new THREE.Points(geometry, material);
            scene.add(galaxyParticles);
        }

        function createHeartCore() {
            const x = 0, y = 0;
            const heartShape = new THREE.Shape();
            heartShape.moveTo(x + 0.25, y + 0.25);
            heartShape.bezierCurveTo(x + 0.25, y + 0.25, x + 0.2, y, x, y);
            heartShape.bezierCurveTo(x - 0.3, y, x - 0.3, y + 0.35, x - 0.3, y + 0.35);
            heartShape.bezierCurveTo(x - 0.3, y + 0.55, x - 0.1, y + 0.77, x + 0.25, y + 0.95);
            heartShape.bezierCurveTo(x + 0.6, y + 0.77, x + 0.8, y + 0.55, x + 0.8, y + 0.35);
            heartShape.bezierCurveTo(x + 0.8, y + 0.35, x + 0.8, y, x + 0.5, y);
            heartShape.bezierCurveTo(x + 0.35, y, x + 0.25, y + 0.25, x + 0.25, y + 0.25);

            const extrudeSettings = { depth: 0.2, bevelEnabled: true, bevelSegments: 3, steps: 2, bevelSize: 0.1, bevelThickness: 0.1 };
            const geometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
            geometry.center();

            const material = new THREE.MeshPhongMaterial({
                color: 0xff1493,
                emissive: 0xff69b4,
                emissiveIntensity: 0.7,
                shininess: 100
            });

            heartMesh = new THREE.Mesh(geometry, material);
            heartMesh.scale.set(1.2, 1.2, 1.2);
            heartMesh.rotation.x = Math.PI;
            scene.add(heartMesh);
        }

        function createTulips() {
            const tulipCount = 16;
            for (let i = 0; i < tulipCount; i++) {
                const tulipGroup = new THREE.Group();
                
                const petalGeo = new THREE.ConeGeometry(0.18, 0.45, 6);
                const petalMat = new THREE.MeshPhongMaterial({ 
                    color: Math.random() > 0.4 ? 0xff69b4 : 0xff1493, 
                    shininess: 80 
                });
                const tulipHead = new THREE.Mesh(petalGeo, petalMat);
                tulipHead.rotation.x = Math.PI;
                tulipGroup.add(tulipHead);

                const stemGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.4, 8);
                const stemMat = new THREE.MeshBasicMaterial({ color: 0x2e8b57 });
                const stem = new THREE.Mesh(stemGeo, stemMat);
                stem.position.y = -0.3;
                tulipGroup.add(stem);

                const angle = (i / tulipCount) * Math.PI * 2;
                const dist = 2 + Math.random() * 2.5;
                tulipGroup.position.set(
                    Math.cos(angle) * dist,
                    (Math.random() - 0.5) * 2,
                    Math.sin(angle) * dist
                );

                tulipGroup.scale.setScalar(0.8 + Math.random() * 0.4);
                scene.add(tulipGroup);
            }
        }

        function spawnTapText(e) {
            if (e.target.closest('.controls')) return;

            const textElem = document.createElement('div');
            textElem.className = 'tap-text';
            textElem.innerText = 'TE AMOO🥺💖';
            textElem.style.left = e.clientX + 'px';
            textElem.style.top = e.clientY + 'px';
            
            document.body.appendChild(textElem);

            setTimeout(() => {
                textElem.remove();
            }, 1200);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (galaxyParticles) galaxyParticles.rotation.y += 0.001;
            if (heartMesh) {
                heartMesh.rotation.y += 0.01;
                heartMesh.position.y = Math.sin(Date.now() * 0.002) * 0.15;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let isPlaying = false;
        function toggleAudio() {
            const btn = document.getElementById('music-btn');
            if (!isPlaying) {
                btn.style.borderColor = '#27c93f';
                btn.innerText = '🔊';
                isPlaying = true;
            } else {
                btn.style.borderColor = 'rgba(255, 105, 180, 0.4)';
                btn.innerText = '🎵';
                isPlaying = false;
            }
        }

        window.onload = init;
    </script>
</body>
</html>
