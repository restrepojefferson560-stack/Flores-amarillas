<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Galaxia de Flores Amarillas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05020a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            display: flex;
            gap: 12px;
        }
        .icon-btn {
            background: rgba(20, 20, 30, 0.6);
            border: 1px solid rgba(255, 105, 180, 0.4);
            color: #ff69b4;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }
        .icon-btn:active { transform: scale(0.9); }

        .3d-label {
            position: absolute;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.8), 0 0 20px rgba(255, 105, 180, 0.5);
            pointer-events: none;
            white-space: nowrap;
            transition: opacity 0.3s;
            font-size: 16px;
        }
        
        .main-label {
            font-size: 22px;
            color: #ff69b4;
            text-shadow: 0 0 12px rgba(255, 105, 180, 1), 0 0 25px rgba(255, 182, 193, 0.8);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="controls">
        <div class="icon-btn" id="music-btn" onclick="toggleAudio()">🎵</div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let galaxyParticles, heartMesh;
        const labels = [];
        const labelData = [
            { text: "TE AMO 💖", pos: [0, 1.8, 0], isMain: true },
            { text: "Mi princesa 👑", pos: [2, 0.8, 2] },
            { text: "Mi amor 💖", pos: [-2.5, -0.2, -1] },
            { text: "Mi vida ✨", pos: [-2, 1.2, 2] },
            { text: "Mi todo 🌎", pos: [2.5, -0.8, -2] },
            { text: "Mi cielo ☁️", pos: [0, -1.8, 1.5] }
        ];

        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x05020a, 0.05);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.8;
            controls.maxDistance = 15;
            controls.minDistance = 3;

            createGalaxy();
            createHeartCore();
            createFlowers();
            createHTMLLabels();

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xff69b4, 2.5, 20);
            pointLight.position.set(0, 0, 0);
            scene.add(pointLight);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createGalaxy() {
            const particleCount = 12000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const colorGold = new THREE.Color(0xffd700);
            const colorYellow = new THREE.Color(0xffea00);
            const colorPink = new THREE.Color(0xff69b4);

            for (let i = 0; i < particleCount; i++) {
                const r = Math.pow(Math.random(), 2) * 6 + 0.5;
                const theta = Math.random() * Math.PI * 2 * 3;
                const phi = (Math.random() - 0.5) * 0.5;

                const x = r * Math.cos(theta);
                const y = phi * (6 - r) * 0.5;
                const z = r * Math.sin(theta);

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                let mixedColor = colorGold.clone();
                if (Math.random() > 0.5) mixedColor.lerp(colorYellow, Math.random());
                if (Math.random() > 0.8) mixedColor.lerp(colorPink, Math.random());

                colors[i * 3] = mixedColor.r;
                colors[i * 3 + 1] = mixedColor.g;
                colors[i * 3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.035,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            galaxyParticles = new THREE.Points(geometry, material);
            scene.add(galaxyParticles);
        }

        function createHeartCore() {
            const x = 0, y = 0;
            const heartShape = new THREE.Shape();
            heartShape.moveTo(x + 0.25, y + 0.25);
            heartShape.bezierCurveTo(x + 0.25, y + 0.25, x + 0.2, y, x, y);
            heartShape.bezierCurveTo(x - 0.3, y, x - 0.3, y + 0.35, x - 0.3, y + 0.35);
            heartShape.bezierCurveTo(x - 0.3, y + 0.55, x - 0.1, y + 0.77, x + 0.25, y + 0.95);
            heartShape.bezierCurveTo(x + 0.6, y + 0.77, x + 0.8, y + 0.55, x + 0.8, y + 0.35);
            heartShape.bezierCurveTo(x + 0.8, y + 0.35, x + 0.8, y, x + 0.5, y);
            heartShape.bezierCurveTo(x + 0.35, y, x + 0.25, y + 0.25, x + 0.25, y + 0.25);

            const extrudeSettings = { depth: 0.2, bevelEnabled: true, bevelSegments: 3, steps: 2, bevelSize: 0.1, bevelThickness: 0.1 };
            const geometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
            geometry.center();

            const material = new THREE.MeshPhongMaterial({
                color: 0xff1493,
                emissive: 0xff69b4,
                emissiveIntensity: 0.6,
                shininess: 100
            });

            heartMesh = new THREE.Mesh(geometry, material);
            heartMesh.scale.set(1.2, 1.2, 1.2);
            heartMesh.rotation.x = Math.PI;
            scene.add(heartMesh);
        }

        function createFlowers() {
            const flowerCount = 12;
            for (let i = 0; i < flowerCount; i++) {
                const flowerGroup = new THREE.Group();
                
                const centerGeo = new THREE.SphereGeometry(0.12, 8, 8);
                const centerMat = new THREE.MeshBasicMaterial({ color: 0x5c3a21 });
                const center = new THREE.Mesh(centerGeo, centerMat);
                flowerGroup.add(center);

                const petalCount = 8;
                const petalGeo = new THREE.ConeGeometry(0.08, 0.3, 5);
                const petalMat = new THREE.MeshBasicMaterial({ color: 0xffea00 });

                for (let j = 0; j < petalCount; j++) {
                    const petal = new THREE.Mesh(petalGeo, petalMat);
                    const angle = (j / petalCount) * Math.PI * 2;
                    petal.position.set(Math.cos(angle) * 0.18, Math.sin(angle) * 0.18, 0);
                    petal.rotation.z = angle - Math.PI / 2;
                    flowerGroup.add(petal);
                }

                const angle = (i / flowerCount) * Math.PI * 2;
                const dist = 2 + Math.random() * 2.5;
                flowerGroup.position.set(
                    Math.cos(angle) * dist,
                    (Math.random() - 0.5) * 2,
                    Math.sin(angle) * dist
                );

                flowerGroup.scale.setScalar(0.8 + Math.random() * 0.4);
                scene.add(flowerGroup);
            }
        }

        function createHTMLLabels() {
            labelData.forEach((data) => {
                const div = document.createElement('div');
                div.className = '3d-label' + (data.isMain ? ' main-label' : '');
                div.innerText = data.text;
                document.body.appendChild(div);
                
                labels.push({
                    element: div,
                    pos: new THREE.Vector3(...data.pos)
                });
            });
        }

        function updateLabels() {
            labels.forEach((label) => {
                const tempV = label.pos.clone();
                tempV.project(camera);

                const x = (tempV.x *  .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;

                label.element.style.transform = `translate(-50%, -50%) translate(${x}px,${y}px)`;
                
                const dist = camera.position.distanceTo(label.pos);
                label.element.style.opacity = (tempV.z < 1 && dist < 12) ? '1' : '0';
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            if (galaxyParticles) galaxyParticles.rotation.y += 0.001;
            if (heartMesh) {
                heartMesh.rotation.y += 0.01;
                heartMesh.position.y = Math.sin(Date.now() * 0.002) * 0.15;
            }

            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let audioCtx, isPlaying = false;
        function toggleAudio() {
            const btn = document.getElementById('music-btn');
            if (!isPlaying) {
                btn.style.borderColor = '#27c93f';
                btn.innerText = '🔊';
                isPlaying = true;
            } else {
                btn.style.borderColor = 'rgba(255, 105, 180, 0.4)';
                btn.innerText = '🎵';
                isPlaying = false;
            }
        }

        window.onload = init;
    </script>
</body>
</html>
